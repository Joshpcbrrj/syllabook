schema_version: "1.1"
name: 18-traduzir-idioma-ensinado
description: "Option 3 on a book that teaches English, into English: stop and ask who the new version is for"
tags: [curto]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: >-
    Quero traduzir para inglês o meu livro "Inglês do zero (exemplo de teste)", que está pronto na pasta
    created-books/ingles-do-zero-teste desta biblioteca do Syllabook. A conversa continua em português.
    Sem GitHub e sem Notion por enquanto.
graders:
  - name: nada-criado-antes
    type: file_exists
    path: translated-books
    exists: false
  - name: pergunta-o-publico
    type: llm
    criteria: >-
      The book teaches English to Portuguese speakers, and the user asks to translate it into English. Pass
      if the reply, in Portuguese, points out that a book teaching English written in English no longer serves
      a beginner who is learning English from zero, and asks the user who the English version is for (for
      example learners with another native language, or teachers), waiting for the answer before any
      glossary or chapter. Fail if it goes straight to a term table or translates anything without raising
      who the new version is for.
